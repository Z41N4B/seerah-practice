<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seerah Practice</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #1f1d1a; --muted: #6b665e;
    --accent: #c2410c; --accent-soft: #fde7da; --line: #e4e0d7; --playing: #15803d;
    --chorus: #7c3aed; --chorus-soft: #ede4fd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --card: #22201d; --text: #f1eee8; --muted: #a39d93;
      --accent: #fb923c; --accent-soft: #3b2417; --line: #35322d; --playing: #4ade80;
      --chorus: #c4b5fd; --chorus-soft: #2e2440; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 24px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  button, select, input { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; }
  .choruses { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .choruses button { padding: 16px; font-weight: 700; font-size: 1.05rem; background: var(--chorus-soft); border-color: var(--chorus); color: var(--chorus); }
  .parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
  .parts button { padding: 12px 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  button.playing { outline: 3px solid var(--playing); outline-offset: 1px; }
  .addmode .parts button:hover, .addmode .choruses button:hover { background: var(--accent-soft); }
  .queue { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft);
    border-radius: 999px; padding: 4px 4px 4px 12px; font-size: .9rem; }
  .chip.ch { background: var(--chorus-soft); color: var(--chorus); font-weight: 600; }
  .chip.playing { outline: 2px solid var(--playing); }
  .chip button { border: none; background: transparent; padding: 2px 8px; border-radius: 999px; }
  .empty { color: var(--muted); font-size: .9rem; }
  .now { position: sticky; bottom: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  #status { font-weight: 600; }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  label { color: var(--muted); font-size: .9rem; }
  input[type=number] { width: 64px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  #err { color: #b91c1c; }
</style>
</head>
<body>
<main>
  <h1>Seerah Practice</h1>
  <p class="sub">Tap a clip to play it. Build a group to play several in a row and loop them.</p>

  <div class="card" id="clipsCard">
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <h2 style="margin:0">Clips</h2>
      <div class="row"><label>Tapping a clip will</label>
        <div class="seg"><button id="modePlay" class="on">▶ Play it</button><button id="modeAdd">+ Add to group</button></div>
      </div>
    </div>
    <div class="choruses" id="choruses"></div>
    <div class="parts" id="parts"></div>
  </div>

  <div class="card">
    <h2>Group</h2>
    <div class="queue" id="queue"></div>
    <div class="row" style="margin-bottom:10px">
      <label>Add parts</label>
      <input type="number" id="from" min="1" max="88" value="1"> <label>to</label>
      <input type="number" id="to" min="1" max="88" value="5">
      <button id="addRange">Add</button>
    </div>
    <div class="row">
      <button class="primary" id="playGroup">▶ Play group</button>
      <button id="undo">Remove last</button>
      <button id="clearGroup">Clear</button>
    </div>
  </div>

  <div class="card now">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <span id="status">Stopped</span>
      <span id="count" class="empty"></span>
    </div>
    <progress id="prog" value="0" max="1"></progress>
    <div class="row" style="margin-top:10px">
      <button id="pause">⏸ Pause</button>
      <button id="stop">⏹ Stop</button>
      <button id="repeat" class="on">🔁 Repeat: on</button>
      <label>Gap <select id="gap">
        <option value="0">none</option><option value="1" selected>1s</option>
        <option value="2">2s</option><option value="3">3s</option></select></label>
      <label>Speed <select id="speed">
        <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
        <option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label>
    </div>
    <div id="err"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const audio = new Audio();
audio.preservesPitch = true;

const PARTS = 88;
const clips = [
  { name: 'Chorus', file: 'clips/Chorus.mp3', chorus: true },
  { name: 'Salawat', file: 'clips/Salawat.mp3', chorus: true },
];
for (let n = 1; n <= PARTS; n++) clips.push({ name: 'Part ' + n, short: String(n), file: `clips/Trim_Seerah_${n}.mp3` });
const partIndex = n => n + 1;   // Part n lives at clips[n + 1]

let queue = load();      // clip indexes; the same clip can appear more than once
let addMode = false;
let mode = null;         // 'single' | 'group'
let current = -1;        // clip index (single) or queue position (group)
let repeat = true;
let loopCount = 0;
let gapTimer = null;

function load() {
  try { const q = JSON.parse(localStorage.getItem('seerahGroup') || '[]'); return q.filter(i => clips[i]); }
  catch { return []; }
}
function save() { try { localStorage.setItem('seerahGroup', JSON.stringify(queue)); } catch {} }

// Build the clip buttons once
const buttons = clips.map((c, i) => {
  const b = document.createElement('button');
  b.textContent = c.chorus ? c.name : c.short;
  b.title = c.name;
  b.onclick = () => addMode ? addToGroup(i) : playSingle(i);
  (c.chorus ? $('choruses') : $('parts')).append(b);
  return b;
});

function addToGroup(...idx) { queue.push(...idx); save(); render(); }

function setAddMode(on) {
  addMode = on;
  $('modePlay').classList.toggle('on', !on);
  $('modeAdd').classList.toggle('on', on);
  $('clipsCard').classList.toggle('addmode', on);
}

function playingClip() {
  if (mode === 'single') return current;
  if (mode === 'group') return queue[current];
  return -1;
}

function render() {
  const p = playingClip();
  buttons.forEach((b, i) => b.classList.toggle('playing', i === p));

  $('queue').innerHTML = '';
  if (!queue.length) {
    $('queue').innerHTML = '<span class="empty">Switch to “+ Add to group” and tap clips in the order you want, or add a range of parts below. A clip can go in more than once.</span>';
  }
  queue.forEach((ci, pos) => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (clips[ci].chorus ? ' ch' : '') + (mode === 'group' && current === pos ? ' playing' : '');
    chip.append(clips[ci].name);
    const x = document.createElement('button');
    x.textContent = '×';
    x.title = 'Remove';
    x.onclick = () => removeAt(pos);
    chip.append(x);
    $('queue').append(chip);
  });

  let status = 'Stopped';
  if (mode === 'single') status = clips[current].name;
  if (mode === 'group') status = `Group: ${clips[queue[current]].name} (${current + 1} of ${queue.length})`;
  if (gapTimer) status += ' — next in a moment…';
  else if (mode && audio.paused) status = 'Paused — ' + status;
  $('status').textContent = status;
  $('count').textContent = mode && loopCount ? `played ${loopCount}×` : '';
  $('pause').textContent = mode && audio.paused && !gapTimer ? '▶ Resume' : '⏸ Pause';
}

function removeAt(pos) {
  queue.splice(pos, 1);
  save();
  if (mode === 'group') {
    if (!queue.length) return stop();
    if (pos < current) current--;
    else if (pos === current) { current = Math.min(current, queue.length - 1); start(clips[queue[current]].file); return; }
  }
  render();
}

function start(file) {
  clearTimeout(gapTimer); gapTimer = null;
  $('err').textContent = '';
  audio.src = file;
  audio.playbackRate = +$('speed').value;
  audio.play().catch(() => {});
  render();
}

function playSingle(i) { mode = 'single'; current = i; loopCount = 0; start(clips[i].file); }

function playGroup() {
  if (!queue.length) return;
  mode = 'group'; current = 0; loopCount = 0;
  start(clips[queue[0]].file);
}

function stop() {
  clearTimeout(gapTimer); gapTimer = null;
  audio.pause(); audio.removeAttribute('src'); audio.load();
  mode = null; current = -1; loopCount = 0;
  $('prog').value = 0;
  render();
}

function afterGap(fn) {
  const gap = +$('gap').value * 1000;
  if (!gap) return fn();
  gapTimer = setTimeout(() => { gapTimer = null; fn(); }, gap);
  render();
}

audio.addEventListener('ended', () => {
  if (mode === 'single') {
    loopCount++;
    if (repeat) afterGap(() => start(clips[current].file)); else render();
  } else if (mode === 'group') {
    if (current < queue.length - 1) {
      current++;
      start(clips[queue[current]].file);
    } else {
      loopCount++;
      if (repeat) afterGap(() => { current = 0; start(clips[queue[0]].file); }); else render();
    }
  }
});
audio.addEventListener('timeupdate', () => {
  $('prog').max = audio.duration || 1;
  $('prog').value = audio.currentTime || 0;
});
audio.addEventListener('error', () => {
  if (audio.getAttribute('src')) $('err').textContent = `Couldn't find ${audio.getAttribute('src')} — keep this page in the same folder as the "clips" folder.`;
});

$('modePlay').onclick = () => setAddMode(false);
$('modeAdd').onclick = () => setAddMode(true);
$('addRange').onclick = () => {
  let a = Math.max(1, Math.min(PARTS, +$('from').value || 1));
  let b = Math.max(1, Math.min(PARTS, +$('to').value || a));
  const step = a <= b ? 1 : -1, idx = [];
  for (let n = a; n !== b + step; n += step) idx.push(partIndex(n));
  addToGroup(...idx);
};
$('playGroup').onclick = playGroup;
$('undo').onclick = () => { if (queue.length) removeAt(queue.length - 1); };
$('clearGroup').onclick = () => { if (mode === 'group') stop(); queue = []; save(); render(); };
$('stop').onclick = stop;
$('pause').onclick = () => {
  if (!mode) return;
  if (gapTimer) { clearTimeout(gapTimer); gapTimer = null; render(); return; }
  if (audio.paused) audio.play(); else audio.pause();
  render();
};
$('repeat').onclick = () => {
  repeat = !repeat;
  $('repeat').classList.toggle('on', repeat);
  $('repeat').textContent = '🔁 Repeat: ' + (repeat ? 'on' : 'off');
};
$('speed').onchange = () => { audio.playbackRate = +$('speed').value; };
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !['SELECT', 'INPUT', 'BUTTON'].includes(e.target.tagName)) { e.preventDefault(); $('pause').click(); }
});

render();
</script>
</body>
</html>
