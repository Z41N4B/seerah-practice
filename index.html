<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn the Seerah – Through the Seerah Song by Zain Bikha</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Learn the life of the Prophet ﷺ through song: listen line by line, repeat each verse, follow the lyrics and star every line you learn.">
<link rel="canonical" href="https://seerah.ummahapps.ai/">
<meta property="og:title" content="Learn the Seerah – Through the Seerah Song by Zain Bikha">
<meta property="og:description" content="Learn the life of the Prophet ﷺ through song: listen line by line, repeat each verse, follow the lyrics and star every line you learn.">
<meta property="og:url" content="https://seerah.ummahapps.ai/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Amiri:wght@400;700&display=swap">
<style>
  :root {
    --bg: #f1f1ec; --card: #ffffff; --text: #1c1b22; --muted: #6b6a73;
    --line: #e4e3dc; --play: #22c55e; --play-soft: #effdf3; --chorus: #8b5cf6; --chorus-soft: #f5f0ff;
    --gold: #f59e0b; --eyebrow: #eab308; --ink: #2b2440;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 18px/1.5 "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 180px; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }

  /* Site header */
  .site { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .site .inner { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; flex: none; }
  .logo svg { width: 28px; height: 28px; }
  .brand { font-size: 1.45rem; font-weight: 700; letter-spacing: -.01em; flex: 1; }
  .home { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 600; background: var(--card); }

  /* Home */
  .eyebrow { color: var(--eyebrow); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: .85rem; margin: 6px 0 10px; }
  .hero h1 { font-size: clamp(2.3rem, 9vw, 3.4rem); line-height: 1.05; margin: 0 0 14px; font-weight: 700; letter-spacing: -.02em; }
  .hero h1 span { display: block; color: var(--muted); font-weight: 500; font-size: .6em; margin-top: 6px; letter-spacing: 0; }
  .hero p { margin: 0 0 22px; color: var(--muted); font-size: 1.15rem; }
  .heroBtns { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }

  .label { font-weight: 700; color: var(--eyebrow); letter-spacing: .12em; text-transform: uppercase; margin: 30px 2px 12px; font-size: .85rem; }
  .choruses { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  @media (max-width: 480px) { .choruses { grid-template-columns: minmax(0, 1fr); } }
  .sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .sec { --c: #ef4444; position: relative; display: flex; align-items: center; gap: 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px; transition: border-color .15s, transform .1s; }
  .sec:hover { border-color: var(--c); }
  .sec:active { transform: scale(.98); }
  .sec .num { width: 48px; height: 48px; border-radius: 12px; background: var(--c); color: #fff; font-weight: 700;
    font-size: 1.4rem; display: grid; place-items: center; flex: none; }
  .sec .num { color: var(--on, #fff); }
  .lineCard:not(.chorus) .bubble { color: var(--on, #fff); }
  .big:not(.alt):not(.on) { color: var(--on, #fff); }
  .sec .t { font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
  .sec .n { color: var(--muted); font-size: .9rem; }
  .readCard + .readCard { margin-top: 10px; }
  /* Daily practice */
  .todayCard { display: flex; align-items: center; gap: 14px; margin-top: 22px; background: var(--card); border: 1px solid #f6e3a6;
    border-radius: 14px; padding: 14px; box-shadow: 0 3px 0 #f0d78a, 0 8px 16px rgba(0,0,0,.05); background-image: linear-gradient(#fffdf5, #fff8e1); }
  .todayCard:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .todayCard.complete { border-color: #86efac; box-shadow: 0 3px 0 #86efac, 0 8px 16px rgba(0,0,0,.05); background-image: linear-gradient(#f6fff9, #e8fbef); }
  .todayCard .flame { width: 56px; height: 56px; border-radius: 14px; background: #fff; display: grid; place-items: center; flex: none; font-size: 1.3rem; line-height: 1;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.08), 0 2px 5px rgba(0,0,0,.12); }
  .todayCard .flame b { font-size: 1.1rem; }
  .todayCard .t { display: block; font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
  .todayCard .n { display: block; color: var(--muted); font-size: .9rem; }
  .todayCard .readGo { margin-left: auto; font-size: 1.3rem; color: var(--muted); }
  .streakBox { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px;
    box-shadow: 0 3px 0 #dedcd3, 0 8px 16px rgba(0,0,0,.05); }
  .streakNums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; gap: 6px; }
  .streakNums b { display: block; font-size: 1.6rem; line-height: 1.1; }
  .streakNums span { color: var(--muted); font-size: .85rem; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin: 14px 0 10px; text-align: center; }
  .day .dn { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .day .dot { display: grid; place-items: center; width: 34px; height: 34px; margin: 4px auto 0; border-radius: 50%; background: var(--line); color: #fff; font-weight: 700; }
  .day.part .dot { background: #fde68a; }
  .day.full .dot { background: var(--play); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
  .day.today .dot { outline: 2px solid var(--ink); outline-offset: 2px; }
  .streakBox .pbar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .streakBox .pbar div { height: 100%; background: var(--gold); border-radius: 999px; }
  .task { --c: #22c55e; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 14px; padding: 14px; margin-bottom: 14px;
    box-shadow: 0 3px 0 #dedcd3, 0 8px 16px rgba(0,0,0,.05); }
  .task.done { background: #f6fff9; }
  .task .lines { margin: 12px 0; }
  .task .actions { margin-bottom: 0; }
  .taskHead { display: flex; gap: 12px; align-items: center; }
  .taskHead .taskIcon { font-size: 1.6rem; flex: none; }
  .taskHead .t { display: block; font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
  .taskHead .n { display: block; color: var(--muted); font-size: .92rem; }
  .planBox { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; font-weight: 600; }
  .seg { display: inline-flex; gap: 6px; }
  .seg button { width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); font-weight: 700; background-image: linear-gradient(#fff, #f7f6f2); box-shadow: 0 2px 0 #d9d7ce; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); background-image: none; }
  .note { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 14px; }
  .readCard { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; box-shadow: 0 3px 0 #dedcd3, 0 8px 16px rgba(0,0,0,.05); transition: transform .08s, box-shadow .08s; }
  .readCard:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .readCard .readIcon { width: 48px; height: 48px; border-radius: 12px; background: #fef6dc; display: grid; place-items: center; font-size: 1.6rem; flex: none;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.08), 0 2px 5px rgba(0,0,0,.12); }
  .readCard .t { display: block; font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
  .readCard .n { display: block; color: var(--muted); font-size: .9rem; }
  .readCard .n.dl { color: #a16207; font-weight: 600; margin-top: 2px; }
  .readCard .readGo { margin-left: auto; font-size: 1.3rem; color: var(--muted); }
  .sec .stars { position: absolute; top: 8px; right: 10px; font-size: .8rem; font-weight: 700; color: var(--muted); }
  .sec .stars.done { color: #a16207; }
  .sec.complete { background: #fffbea; border-color: #f6e3a6; }

  .progress { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; }
  .progress .ptext span { color: var(--muted); font-size: .9rem; }
  .progress .pbar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .progress .pbar div { height: 100%; background: var(--gold); border-radius: 999px; transition: width .3s; }
  .progress.done { background: #fffbea; border-color: #f6e3a6; font-weight: 700; font-size: 1.1rem; text-align: center; }

  /* Buttons */
  .big { border-radius: 10px; padding: 13px 20px; font-weight: 700; font-size: 1.05rem; background: var(--c, var(--ink)); color: #fff;
    border: 1px solid var(--c, var(--ink)); transition: filter .15s; }
  .big:hover { filter: brightness(1.08); }
  .big.alt { background: var(--card); color: var(--text); border-color: var(--line); }
  .big.on { background: var(--gold); color: #fff; border-color: var(--gold); }

  /* Section page */
  .sectitle { font-size: clamp(2rem, 8vw, 2.8rem); line-height: 1.1; font-weight: 700; margin: 0 0 18px; letter-spacing: -.02em; }
  .sectitle input { width: 100%; font-weight: 700; border: 1px dashed var(--c); border-radius: 10px; padding: 4px 10px; background: #fff; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .actions .big { flex: 1; min-width: 150px; }
  .hint { background: #fef6dc; border: 1px solid #f6e3a6; border-radius: 12px; padding: 10px 14px; margin: -4px 0 14px; font-size: .95rem; }
  .picked { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 2px; background: #fff; border: 1px solid #f0d78a; border-radius: 999px; padding: 3px 4px 3px 12px; font-weight: 600; font-size: .9rem; box-shadow: 0 2px 0 #f0d78a; }
  .chip button { width: 28px; height: 28px; border-radius: 999px; font-size: 1.1rem; line-height: 1; color: #b91c1c; }
  .chip button:hover { background: #fee2e2; }

  .lines { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .lineCard { --c2: var(--c); display: flex; align-items: center; gap: 14px; width: 100%; text-align: start;
    background: var(--card); border-radius: 14px; padding: 12px 14px; border: 1px solid var(--line);
    transition: border-color .15s, background .15s; position: relative; }
  .lineCard:hover { border-color: var(--c2); }
  .lineCard:has(.lineMain) { padding: 0 6px 0 0; gap: 0; }
  .lineMain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 12px 8px 12px 14px; text-align: start; }
  .starBtn { flex: none; width: 48px; height: 48px; border-radius: 12px; font-size: 1.7rem; line-height: 1; color: #c9c6bd; }
  .starBtn:hover { background: #fffbea; color: var(--gold); }
  .lineCard.learnt { border-color: #f6d77a; }
  .lineCard.learnt .starBtn { color: inherit; }
  .lineCard.learnt.pop .starBtn { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .lineCard .bubble { flex: none; width: 42px; height: 42px; border-radius: 10px; background: var(--c2); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 1.1rem; }
  .lineCard .words { flex: 1; font-size: 1.15rem; font-weight: 500; white-space: pre-line; font-style: italic; }
  .lineCard .words:not(.empty) { font-size: 1.25rem; }
  .lineCard .words.empty { color: var(--muted); }
  .lineCard .words { min-width: 0; }
  .lineCard .words .ln { display: block; }
  .lineCard .words .ln:dir(rtl) { font-style: normal; font-size: 1.35rem; font-family: "Amiri", "Traditional Arabic", serif; }
  .bubble svg { width: 30px; height: 30px; display: block; }
  .lineCard .icon { flex: none; font-size: 1.2rem; opacity: .8; }
  .lineCard.chorus { --c2: var(--c, var(--ink)); }
  .lineCard.chorus .bubble { background: #fff; border: 1px solid var(--line); }
  .lineCard.playing { border-color: var(--play); background: var(--play-soft); box-shadow: 0 0 0 1px var(--play); }
  .lineCard .pick { position: absolute; top: -8px; right: -6px; background: var(--gold); color: #fff; font-weight: 700;
    border-radius: 999px; min-width: 28px; height: 28px; display: grid; place-items: center; padding: 0 8px; font-size: .9rem; }

  /* Player bar */
  .player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .player .inner { max-width: 760px; margin: 0 auto; }
  .now { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; margin-bottom: 6px; }
  .now .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  .bar div { height: 100%; width: 0; background: var(--play); border-radius: 999px; transition: width .2s linear; }
  .ctrls { display: flex; gap: 8px; }
  .ctrl { flex: 1; border-radius: 10px; padding: 8px 4px; border: 1px solid var(--line); font-weight: 600; font-size: .95rem; }
  .ctrl .e { display: block; font-size: 1.3rem; line-height: 1.15; }
  .ctrl.on { background: var(--play-soft); border-color: var(--play); color: #166534; }

  .nextNav { display: flex; margin-top: 26px; }
  .nextNav .big { flex: 1; text-align: center; font-size: 1.15rem; padding: 16px 20px; }
  #err { color: #b91c1c; font-size: .9rem; }

  /* 3D raised look: soft top highlight, darker bottom edge, presses down when tapped */
  .big, .ctrl, .home, .sec, .lineCard, .progress {
    transition: transform .08s, box-shadow .08s, border-color .15s, background .15s; }
  .big:not(.alt):not(.on), .big.on {
    background-image: linear-gradient(rgba(255,255,255,.22), var(--shade, rgba(0,0,0,.08)));
    box-shadow: 0 4px 0 rgba(0,0,0,.22), 0 8px 16px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.4); }
  .big.alt, .ctrl, .home {
    background-image: linear-gradient(#fff, #f7f6f2);
    box-shadow: 0 3px 0 #d9d7ce, 0 6px 12px rgba(0,0,0,.05), inset 0 1px 0 #fff; }
  .ctrl.on { background-image: linear-gradient(#f3fff7, #dcfce7); box-shadow: 0 3px 0 #86efac, 0 6px 12px rgba(0,0,0,.05); }
  .sec, .lineCard, .progress { box-shadow: 0 3px 0 #dedcd3, 0 8px 16px rgba(0,0,0,.05); }
  .lineCard.learnt { box-shadow: 0 3px 0 #f6d77a, 0 8px 16px rgba(0,0,0,.05); }
  .lineCard.playing { box-shadow: 0 3px 0 var(--play), 0 0 0 1px var(--play); }
  .big:active, .ctrl:active, .home:active, .sec:active, .lineCard:has(.lineMain:active) {
    transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .sec .num, .lineCard .bubble, .logo {
    background-image: linear-gradient(rgba(255,255,255,.28), var(--shade, rgba(0,0,0,.10)));
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.35), 0 2px 5px rgba(0,0,0,.18);
    text-shadow: 0 1px 1px rgba(0,0,0,.18); }
  .lineCard.chorus .bubble { background-image: linear-gradient(#fff, #f4f3ee);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.08), 0 2px 5px rgba(0,0,0,.12); }
  .bubble svg, .logo svg { filter: drop-shadow(0 1.5px 1px rgba(0,0,0,.3)); }
  .icon, .ctrl .e, .lineCard.learnt .starBtn { filter: drop-shadow(0 2px 1.5px rgba(0,0,0,.22)); }
  .progress .pbar div, .bar div { background-image: linear-gradient(rgba(255,255,255,.35), rgba(0,0,0,.08)); }
</style>
</head>
<body>
<header class="site"><div class="inner">
  <a class="logo" href="#" id="logo" aria-label="Home"></a>
  <a class="brand" href="#">Learn the Seerah</a>
  <button class="home hidden" id="backBtn">← Back</button>
</div></header>
<main id="app"></main>

<div class="player">
  <div class="inner">
    <div class="now"><span class="what" id="what">Tap a line to listen 🎧</span><span id="stars"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="ctrls">
      <button class="ctrl" id="pause"><span class="e">⏸️</span><span>Pause</span></button>
      <button class="ctrl" id="stop"><span class="e">⏹️</span><span>Stop</span></button>
      <button class="ctrl on" id="repeat"><span class="e">🔁</span><span>Repeat</span></button>
      <button class="ctrl" id="slow"><span class="e">🐢</span><span>Slow</span></button>
    </div>
    <div id="err"></div>
  </div>
</div>

<!-- Always fetch the newest lyrics, so updates show straight away -->
<script>document.write('<script src="lyrics.js?t=' + Date.now() + '"><\/script>');</script>
<script>
const $ = id => document.getElementById(id);
const COLORS = ['#ef4444', '#f97316', '#ffe000', '#22c55e', '#14b8a6', '#0ea5e9', '#6366f1', '#a855f7', '#ec4899', '#84cc16'];
// Text colour to use on top of each section colour (dark on the bright yellow so it stays readable)
const onColor = i => COLORS[i % COLORS.length] === '#ffe000' ? '#3b2f00' : '#fff';
const shadeFor = i => COLORS[i % COLORS.length] === '#ffe000' ? 'rgba(255,255,255,0)' : 'rgba(0,0,0,.10)';
const SECTIONS = window.SECTIONS || [];
const BASE = window.LYRICS || {};
const KAABA = `<svg viewBox="0 0 32 32" aria-label="Kaaba"><path d="M5 10 16 6l11 4v15l-11 4-11-4z" fill="#1c1917"/><path d="M16 6v23" stroke="#44403c" stroke-width="1"/><path d="M5 13.5 16 17.5l11-4v2.6L16 20.1 5 16.1z" fill="#eab308"/><rect x="19" y="20.5" width="4" height="6" rx=".6" transform="skewY(-20)" transform-origin="21 23" fill="#ca8a04"/></svg>`;
const MADINAH = `<svg viewBox="0 0 32 32" aria-label="Madinah green dome"><path d="M16 2.5v4" stroke="#facc15" stroke-width="1.6"/><path d="M17.6 3.2a1.9 1.9 0 1 1-1.4-.9 1.5 1.5 0 1 0 1.4.9z" fill="#facc15"/><path d="M6.5 20c0-7 4.2-12.5 9.5-12.5S25.5 13 25.5 20z" fill="#16a34a"/><path d="M9 11.5c1.5-2.6 4-4 7-4" stroke="#4ade80" stroke-width="1.4" fill="none" stroke-linecap="round"/><rect x="5" y="20" width="22" height="3" rx="1" fill="#15803d"/><rect x="6" y="23" width="20" height="5.5" fill="#f5f5f4"/><path d="M10 28.5v-3a1.5 1.5 0 0 1 3 0v3M19 28.5v-3a1.5 1.5 0 0 1 3 0v3" fill="#a8a29e"/></svg>`;
const CHORUSES = [
  { key: 'chorus', name: 'La-ilaha-ill-Allah', icon: KAABA, file: 'clips/Chorus.mp3' },
  { key: 'salawat', name: 'Salawat', icon: MADINAH, file: 'clips/Salawat.mp3' },
];
// Extra chorus buttons placed inside a section, after a given line
const INSERTS = window.INSERTS || {};
document.getElementById('logo').innerHTML = MADINAH;

const fileFor = key => CHORUSES.find(c => c.key === key)?.file || `clips/Trim_Seerah_${key}.mp3`;
const nameFor = key => CHORUSES.find(c => c.key === key)?.name || `Line ${key}`;

const lyric = key => (BASE[key] ?? '').trim();
const title = i => SECTIONS[i].title;
// Typed-in lyrics from the old grown-up mode are no longer used; tidy them away
try { localStorage.removeItem('seerahEdits'); } catch {}

// Lines the child has marked as learnt (kept in this browser)
let justToggled = null;
const load = (k, fallback) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fallback; } catch { return fallback; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const dayStr = (d = new Date()) => d.toLocaleDateString('en-CA');   // YYYY-MM-DD in the viewer's time zone
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dayStr(d); };
const OLD_DAY = '2000-01-01';   // lines starred before the tracker existed count as long-learnt

// When each line was learnt: { "12": "2026-11-09", ... }
let learntAt = load('seerahLearntAt', null);
if (!learntAt) {
  learntAt = {};
  load('seerahLearnt', []).forEach(k => { learntAt[k] = OLD_DAY; });
}
let learnt = new Set(Object.keys(learntAt));
const saveLearnt = () => {
  [...learnt].forEach(k => { if (!learntAt[k]) learntAt[k] = dayStr(); });
  Object.keys(learntAt).forEach(k => { if (!learnt.has(k)) delete learntAt[k]; });
  store('seerahLearntAt', learntAt);
  store('seerahLearnt', [...learnt]);
  markNewDone();
};
const lineNumbers = i => { const s = SECTIONS[i], out = []; for (let n = s.from; n <= s.to; n++) out.push(String(n)); return out; };
const learntCount = i => lineNumbers(i).filter(k => learnt.has(k)).length;
const currentSection = () => { const m = location.hash.match(/^#section-(\d+)$/); return m && SECTIONS[+m[1] - 1] ? +m[1] - 1 : -1; };

// ---------- daily practice (like a hifdh tracker) ----------
// Each day: learn a few NEW lines, revise RECENT lines (learnt in the last week),
// and revise one rotating chunk of OLDER lines. Finishing all three keeps the streak going.
const ALL_LINES = SECTIONS.length ? lineNumbersRange(SECTIONS[0].from, SECTIONS[SECTIONS.length - 1].to) : [];
function lineNumbersRange(a, b) { const out = []; for (let n = a; n <= b; n++) out.push(String(n)); return out; }
const RECENT_DAYS = 7, OLD_CHUNK = 10;
let plan = Object.assign({ perDay: 2 }, load('seerahPlan', {}));
let log = load('seerahLog', {});   // { "2026-11-09": { new: true, recent: true, old: true } }
const savePlan = () => store('seerahPlan', plan);
const saveLog = () => store('seerahLog', log);
const TASK = { new: 'New lines', recent: 'Recent revision', old: 'Older revision' };

function todayPlan() {
  const today = dayStr(), weekAgo = daysAgo(RECENT_DAYS);
  const learntToday = ALL_LINES.filter(k => learntAt[k] === today);
  const notYet = ALL_LINES.filter(k => !learnt.has(k));
  const newLines = [...learntToday, ...notYet.slice(0, Math.max(0, plan.perDay - learntToday.length))];
  const recent = ALL_LINES.filter(k => learntAt[k] && learntAt[k] < today && learntAt[k] >= weekAgo);
  const older = ALL_LINES.filter(k => learntAt[k] && learntAt[k] < weekAgo);
  // Rotate through the older lines a chunk at a time: one chunk per day the older revision is done
  const chunks = Math.ceil(older.length / OLD_CHUNK);
  const doneBefore = Object.keys(log).filter(d => d < today && log[d].old).length;
  const c = chunks ? doneBefore % chunks : 0;
  const old = older.slice(c * OLD_CHUNK, c * OLD_CHUNK + OLD_CHUNK);
  const t = log[today] || {};
  return {
    newLines, recent, old,
    done: {
      new: !!t.new || newLines.length === 0,
      recent: !!t.recent || recent.length === 0,
      old: !!t.old || old.length === 0,
    },
    learntToday: learntToday.length,
  };
}
const dayComplete = d => { const t = log[d]; return !!(t && t.new && t.recent && t.old); };
function markTask(task) {
  const today = dayStr();
  log[today] = Object.assign({}, log[today], { [task]: true });
  // A task with nothing in it counts as done, so an empty day can still be completed
  const p = todayPlan();
  ['new', 'recent', 'old'].forEach(k => { if (p.done[k]) log[today][k] = true; });
  saveLog();
}
function markNewDone() {
  const p = todayPlan();
  if (p.newLines.length && p.newLines.every(k => learnt.has(k))) markTask('new');
}
function streak() {
  let n = 0, i = dayComplete(dayStr()) ? 0 : 1;
  while (dayComplete(daysAgo(i))) { n++; i++; }
  return n;
}
function bestStreak() {
  const days = Object.keys(log).filter(dayComplete).sort();
  let best = 0, run = 0, prev = null;
  days.forEach(d => {
    const gap = prev ? Math.round((new Date(d) - new Date(prev)) / 864e5) : 0;
    run = gap === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d;
  });
  return best;
}

let choosing = false;
let chosen = [];

// ---------- pages ----------
function route() {
  const m = location.hash.match(/^#section-(\d+)$/);
  const i = m ? +m[1] - 1 : -1;
  choosing = false; chosen = [];
  const song = location.hash === '#song', today = location.hash === '#today';
  if (today) renderToday(); else if (song) renderSong(); else if (SECTIONS[i]) renderSection(i); else renderHome();
  $('backBtn').classList.toggle('hidden', !song && !today && !SECTIONS[i]);
  window.scrollTo(0, 0);
}

function renderHome() {
  const app = $('app');
  app.style.removeProperty('--c');
  app.style.removeProperty('--on');
  app.style.removeProperty('--shade');
  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow">The life of the Prophet ﷺ, in song</div>
      <h1>Learn the Seerah<span>through the Seerah Song by Zain Bikha</span></h1>
      <p>Listen to each line, repeat it as many times as you like, and put the sections together until you know the whole poem by heart.</p>
      <div class="heroBtns"><button class="big" id="playSong">Play the whole song</button></div>
    </div>
    ${todayCard()}
    <div class="label">Repeat with me!</div>
    <div class="choruses" id="choruses"></div>
    <div class="label">Sections</div>
    <div class="sections" id="sections"></div>
    <div class="label">Read more</div>
    <a class="readCard" href="https://www.kalamullah.com/Books/When%20The%20Moon%20Split.pdf" target="_blank" rel="noopener">
      <span class="readIcon">📖</span>
      <span><span class="t">Read the full story of the Seerah</span>
      <span class="n">When the Moon Split</span>
      <span class="n dl">Click here to download the book (PDF)</span></span>
      <span class="readGo">↗</span>
    </a>
    <a class="readCard" href="https://www.kalamullah.com/Books/ShamaailTirmidhi-ImamTirmidhi-IntroAndPage1-223.pdf" target="_blank" rel="noopener">
      <span class="readIcon">📗</span>
      <span><span class="t">The Prophet’s ﷺ character and appearance</span>
      <span class="n">Shama’il at-Tirmidhi</span>
      <span class="n dl">Click here to download the book (PDF)</span></span>
      <span class="readGo">↗</span>
    </a>`;
  CHORUSES.forEach(c => $('choruses').append(lineCard(c.key, true)));
  SECTIONS.forEach((s, i) => {
    const a = document.createElement('a');
    a.href = `#section-${i + 1}`;
    a.style.textDecoration = 'none'; a.style.color = 'inherit';
    const n = s.to - s.from + 1, got = learntCount(i);
    const badge = got === n ? '<span class="stars done">🏆 Learnt!</span>' : got ? `<span class="stars">⭐ ${got}/${n}</span>` : '';
    a.innerHTML = `<div class="sec ${got === n ? 'complete' : ''}" style="--c:${COLORS[i % COLORS.length]};--on:${onColor(i)};--shade:${shadeFor(i)}">
      ${badge}
      <div class="num">${i + 1}</div><div><div class="t">${esc(title(i))}</div><div class="n">Lines ${s.from}–${s.to}</div></div></div>`;
    $('sections').append(a);
  });
  $('playSong').onclick = () => { location.hash = '#song'; playSong(); };
  paintPlaying();
}

// Home page summary of today's practice
function todayCard() {
  const p = todayPlan(), s = streak();
  const doneCount = ['new', 'recent', 'old'].filter(k => p.done[k]).length;
  const allDone = dayComplete(dayStr());
  return `<a class="todayCard ${allDone ? 'complete' : ''}" href="#today">
    <span class="flame">${s ? '🔥' : '🌱'}<b>${s}</b></span>
    <span class="tc"><span class="t">${allDone ? 'Today’s practice is done! 🎉' : 'Today’s practice'}</span>
      <span class="n">${s ? `${s}-day streak` : 'Start your streak today'} · ${doneCount} of 3 tasks done</span></span>
    <span class="readGo">→</span></a>`;
}

function weekStrip() {
  const names = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  let html = '';
  for (let i = 6; i >= 0; i--) {
    const d = daysAgo(i), t = log[d] || {};
    const parts = ['new', 'recent', 'old'].filter(k => t[k]).length;
    const cls = dayComplete(d) ? 'full' : parts ? 'part' : '';
    html += `<span class="day ${cls} ${i === 0 ? 'today' : ''}"><span class="dn">${names[new Date(d + 'T12:00').getDay()]}</span><span class="dot">${dayComplete(d) ? '✓' : ''}</span></span>`;
  }
  return `<div class="week">${html}</div>`;
}

function taskBox(key, emoji, heading, help, keys, done, color) {
  const playable = keys.length > 0;
  return `<div class="task ${done ? 'done' : ''}" style="--c:${color}">
    <div class="taskHead">
      <span class="taskIcon">${done ? '✅' : emoji}</span>
      <span><span class="t">${heading}</span><span class="n">${help}</span></span>
    </div>
    ${playable ? `<div class="lines" id="task-${key}"></div>
    <div class="actions">
      <button class="big" data-play="${key}">Play ${keys.length > 1 ? `all ${keys.length}` : 'it'}</button>
      ${key !== 'new' ? `<button class="big alt" data-done="${key}">${done ? '✓ Done' : 'Mark as done'}</button>` : ''}
    </div>` : ''}
  </div>`;
}

function renderToday() {
  const app = $('app');
  ['--c', '--on', '--shade'].forEach(p => app.style.removeProperty(p));
  const p = todayPlan(), s = streak(), best = bestStreak();
  const total = ALL_LINES.length, got = ALL_LINES.filter(k => learnt.has(k)).length;
  const allDone = dayComplete(dayStr());
  const newHelp = p.newLines.length === 0 ? 'MashaAllah, every line is learnt! Keep revising.'
    : `Listen and repeat, then tap ☆ when you know each one (${Math.min(p.learntToday, p.newLines.length)} of ${p.newLines.length} done)`;
  app.innerHTML = `
    <div class="eyebrow">Learn the Seerah</div>
    <h2 class="sectitle">Today’s Practice</h2>
    <div class="streakBox">
      <div class="streakNums">
        <div><b>${s ? '🔥 ' : ''}${s}</b><span>day streak</span></div>
        <div><b>${best}</b><span>best streak</span></div>
        <div><b>${got}/${total}</b><span>lines learnt</span></div>
      </div>
      ${weekStrip()}
      <div class="pbar"><div style="width:${100 * got / total}%"></div></div>
    </div>
    ${allDone ? '<div class="progress done">🎉 MashaAllah! Today’s practice is complete. See you tomorrow, in sha Allah!</div>' : ''}
    ${taskBox('new', '🌱', '1 · New lines', newHelp, p.newLines, p.done.new, '#22c55e')}
    ${taskBox('recent', '🔁', '2 · Recent revision', p.recent.length ? `Lines learnt in the last ${RECENT_DAYS} days. Play them through once.` : 'Lines you learn will come back here for a week of revision.', p.recent, p.done.recent, '#0ea5e9')}
    ${taskBox('old', '📚', '3 · Older revision', p.old.length ? `A different set of older lines each day, so nothing is forgotten.` : 'After a week, lines move here so you keep revising them.', p.old, p.done.old, '#a855f7')}
    <div class="planBox">
      <span>New lines each day</span>
      <span class="seg">${[1, 2, 3, 5].map(n => `<button data-per="${n}" class="${plan.perDay === n ? 'on' : ''}">${n}</button>`).join('')}</span>
    </div>
    <p class="note">Your progress is saved on this phone or computer.</p>`;
  const lists = { new: p.newLines, recent: p.recent, old: p.old };
  Object.entries(lists).forEach(([k, keys]) => { const box = $('task-' + k); if (box) keys.forEach(key => box.append(lineCard(key, false, key))); });
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => playList(lists[b.dataset.play], TASK[b.dataset.play]));
  document.querySelectorAll('[data-done]').forEach(b => b.onclick = () => { markTask(b.dataset.done); refresh(); });
  document.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { plan.perDay = +b.dataset.per; savePlan(); refresh(); });
  paintPlaying();
}

// Redraw the current page without jumping back to the top
function refresh() {
  const y = scrollY, i = currentSection();
  if (location.hash === '#today') renderToday();
  else if (i >= 0) renderSection(i);
  else if (location.hash === '#song') renderSong();
  else renderHome();
  scrollTo(0, y);
}

// Whole song: every section in order, with the extra Salawat and La-ilaha-ill-Allah in their places
const songKeys = () => SECTIONS.flatMap((_, i) => sectionKeys(i));
const SONG = 'Whole song';
function playSong() { playList(songKeys(), SONG); }

// Page showing every lyric in order; the line being sung lights up and scrolls into view
function renderSong() {
  const app = $('app');
  ['--c', '--on', '--shade'].forEach(p => app.style.removeProperty(p));
  app.innerHTML = `
    <div class="eyebrow">Learn the Seerah</div>
    <h2 class="sectitle">The Whole Song</h2>
    <div class="actions"><button class="big" id="playFromStart">Play from the start</button></div>
    <div id="songLines"></div>`;
  let p = 0;
  SECTIONS.forEach((s, i) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = `--c:${COLORS[i % COLORS.length]};--on:${onColor(i)};--shade:${shadeFor(i)}`;
    wrap.innerHTML = `<div class="label songHead" style="color:var(--c)">${i + 1} · ${esc(title(i))}</div><div class="lines"></div>`;
    sectionKeys(i).forEach(k => {
      const card = lineCard(k, CHORUSES.some(c => c.key === k), k);
      card.dataset.pos = p;
      const at = p++;
      // Tapping a line in the song carries on singing the song from there
      card.querySelector('.lineMain').onclick = () => { playList(songKeys(), SONG); pos = at; start(); };
      wrap.querySelector('.lines').append(card);
    });
    $('songLines').append(wrap);
  });
  $('playFromStart').onclick = playSong;
  paintPlaying();
}

// The lines in a section, with any extra chorus buttons slotted in after their line
function sectionKeys(i) {
  const s = SECTIONS[i], keys = [];
  for (let n = s.from; n <= s.to; n++) {
    keys.push(String(n));
    if (INSERTS[n]) keys.push(INSERTS[n]);
  }
  return keys;
}

function renderSection(i) {
  const s = SECTIONS[i];
  const app = $('app');
  app.style.setProperty('--c', COLORS[i % COLORS.length]);
  app.style.setProperty('--on', onColor(i));
  app.style.setProperty('--shade', shadeFor(i));
  app.innerHTML = `
    <div class="eyebrow" style="color:var(--c)">Section ${i + 1} · Lines ${s.from}–${s.to}</div>
    <h2 class="sectitle">${esc(title(i))}</h2>
    ${progressBox(i)}
    <div class="actions">
      <button class="big" id="playAll">Play whole section</button>
      <button class="big alt ${choosing ? 'on' : ''}" id="choose">${choosing ? (chosen.length ? `▶️ Play my ${chosen.length}` : '➕ Tap lines to pick') : '➕ Pick my lines'}</button>
    </div>
    ${choosing ? `<div class="hint">Tap the lines you want, in the order you want. You can add La-ilaha-ill-Allah and Salawat too! Then press <b>Play my lines</b>. <button id="cancelPick" style="text-decoration:underline">Cancel</button>
      ${chosen.length ? `<div class="picked">${chosen.map((k, j) => `<span class="chip">${j + 1}. ${esc(nameFor(k))}<button data-remove="${j}" aria-label="Remove">×</button></span>`).join('')}</div>` : ''}</div>` : ''}
    <div class="lines" id="lines"></div>
    <div class="label">Repeat with me!</div>
    <div class="lines" id="chorusLines"></div>
    ${nextNav(i)}`;
  sectionKeys(i).forEach(k => $('lines').append(lineCard(k, CHORUSES.some(c => c.key === k), k)));
  CHORUSES.forEach(c => $('chorusLines').append(lineCard(c.key, true)));

  $('playAll').onclick = () => playList(sectionKeys(i), title(i), i);
  $('choose').onclick = () => {
    if (choosing && chosen.length) { playList([...chosen], 'My lines', i); choosing = false; chosen = []; renderSection(i); return; }
    choosing = true; renderSection(i);
  };
  $('cancelPick')?.addEventListener('click', () => { choosing = false; chosen = []; renderSection(i); });
  document.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => { chosen.splice(+b.dataset.remove, 1); renderSection(i); });
  paintPlaying();
}

// Big button at the bottom of a section that goes on to the next one (or home after the last)
function nextNav(i) {
  const j = i + 1;
  if (!SECTIONS[j]) return '';
  return `<div class="nextNav"><a class="big" href="#section-${j + 1}" style="--c:${COLORS[j % COLORS.length]};--on:${onColor(j)};--shade:${shadeFor(j)}">Next: ${esc(title(j))} →</a></div>`;
}

function progressBox(i) {
  const n = lineNumbers(i).length, got = learntCount(i);
  if (got === n) return `<div class="progress done">🏆 MashaAllah! You've learnt the whole section!</div>`;
  return `<div class="progress">
    <div class="ptext">⭐ <b>${got} of ${n}</b> lines learnt <span>· tap ☆ when you know a line</span></div>
    <div class="pbar"><div style="width:${100 * got / n}%"></div></div></div>`;
}

function lineCard(key, isChorus, shownNum) {
  const c = CHORUSES.find(x => x.key === key);
  const card = document.createElement('div');
  card.className = 'lineCard' + (isChorus ? ' chorus' : '') + (learnt.has(key) ? ' learnt' : '') + (key === justToggled ? ' pop' : '');
  card.dataset.key = key;
  const words = lyric(key);
  const picks = chosen.map((k, j) => k === key ? j + 1 : 0).filter(Boolean);
  card.innerHTML = `<button class="lineMain">
      <span class="bubble">${c ? c.icon : shownNum}</span>
      <span class="words ${words ? '' : 'empty'}">${words ? words.split('\n').map(l => `<span class="ln" dir="auto">${esc(l)}</span>`).join('') : esc(nameFor(key))}</span>
      ${choosing ? '<span class="icon">➕</span>' : ''}
    </button>
    <button class="starBtn" title="${learnt.has(key) ? 'Learnt! Tap to unmark' : 'Tap when you know this line'}">${learnt.has(key) ? '⭐' : '☆'}</button>
    ${picks.length ? `<span class="pick">${picks.join(', ')}</span>` : ''}`;
  card.querySelector('.lineMain').onclick = () => {
    if (choosing) {
      chosen.push(key);
      renderSection(currentSection());
    } else {
      playList([key], nameFor(key));
    }
  };
  card.querySelector('.starBtn').onclick = () => {
    if (learnt.has(key)) learnt.delete(key); else learnt.add(key);
    justToggled = key; setTimeout(() => { justToggled = null; }, 50);
    saveLearnt();
    refresh();
  };
  // The Salawat words stay on one line, shrinking to fit narrow phone screens
  if (key === 'salawat' || key === 'chorus') queueMicrotask(fitSalawat);
  return card;
}

function fitOneLine(el) {
  el.style.whiteSpace = 'nowrap';
  el.style.fontSize = '';
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && size > 14) el.style.fontSize = (size -= 0.5) + 'px';
  // On a very narrow screen, wrapping beats text too small to read
  if (el.scrollWidth > el.clientWidth) el.style.whiteSpace = '';
}
// Fit the Salawat on one line, then give La-ilaha-ill-Allah the same size so they match
const fitSalawat = () => {
  const sal = [...document.querySelectorAll('.lineCard[data-key="salawat"] .ln')];
  sal.forEach(fitOneLine);
  const size = sal.length ? getComputedStyle(sal[0]).fontSize : '';
  document.querySelectorAll('.lineCard[data-key="chorus"] .ln').forEach(el => { el.style.fontSize = size; });
};
window.addEventListener('resize', fitSalawat);
document.fonts?.ready.then(fitSalawat);

function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

// ---------- player ----------
const audio = new Audio();
audio.preservesPitch = true;
let list = [], pos = -1, listName = '', listSection = -1;
let repeat = true, slow = false, loops = 0, gapTimer = null;

function playList(keys, name, sectionIndex = -1) {
  list = keys; pos = 0; listName = name; listSection = sectionIndex; loops = 0;
  start();
}

function start() {
  clearTimeout(gapTimer); gapTimer = null;
  $('err').textContent = '';
  audio.src = fileFor(list[pos]);
  audio.playbackRate = slow ? 0.75 : 1;
  audio.play().catch(() => {});
  paintPlaying();
}

function stop() {
  clearTimeout(gapTimer); gapTimer = null;
  audio.pause(); audio.removeAttribute('src'); audio.load();
  list = []; pos = -1; loops = 0;
  $('prog').style.width = '0';
  paintPlaying();
}

audio.addEventListener('ended', () => {
  if (pos < list.length - 1) { pos++; start(); return; }
  loops++;
  // Listening all the way through a revision list ticks that task off for today
  const task = Object.keys(TASK).find(k => TASK[k] === listName && k !== 'new');
  if (task && !(log[dayStr()] || {})[task]) { markTask(task); if (location.hash === '#today' || !location.hash) refresh(); }
  if (repeat) { gapTimer = setTimeout(() => { gapTimer = null; pos = 0; start(); }, 1000); }
  paintPlaying();
});
audio.addEventListener('timeupdate', () => {
  $('prog').style.width = audio.duration ? (100 * audio.currentTime / audio.duration) + '%' : '0';
});
audio.addEventListener('error', () => {
  if (audio.getAttribute('src')) $('err').textContent = `Oops, couldn't find ${audio.getAttribute('src')}`;
});

function paintPlaying() {
  const key = pos >= 0 ? list[pos] : null;
  const onSongPage = !!$('songLines');
  document.querySelectorAll('.lineCard[data-key]').forEach(el => {
    // On the song page, light up the exact spot (La-ilaha-ill-Allah and Salawat appear more than once)
    const hit = onSongPage && el.dataset.pos !== undefined ? listName === SONG && +el.dataset.pos === pos : el.dataset.key === key;
    const was = el.classList.contains('playing');
    el.classList.toggle('playing', hit && !audio.paused);
    if (onSongPage && hit && !was && !audio.paused) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  let what = 'Tap a line to listen 🎧';
  if (key) {
    what = list.length > 1 ? `${listName}: ${nameFor(key)} (${pos + 1} of ${list.length})` : nameFor(key);
    if (gapTimer) what = '🎉 Again!';
    else if (audio.paused) what = '⏸️ ' + what;
  }
  $('what').textContent = what;
  $('stars').textContent = key && loops ? `🔁 ×${loops}` : '';
  $('pause').innerHTML = key && audio.paused && !gapTimer
    ? '<span class="e">▶️</span><span>Play</span>' : '<span class="e">⏸️</span><span>Pause</span>';
}
audio.addEventListener('play', paintPlaying);
audio.addEventListener('pause', paintPlaying);

$('pause').onclick = () => {
  if (pos < 0) return;
  if (gapTimer) { clearTimeout(gapTimer); gapTimer = null; paintPlaying(); return; }
  if (audio.paused) audio.play(); else audio.pause();
};
$('stop').onclick = stop;
$('repeat').onclick = () => { repeat = !repeat; $('repeat').classList.toggle('on', repeat); };
$('slow').onclick = () => { slow = !slow; audio.playbackRate = slow ? 0.75 : 1; $('slow').classList.toggle('on', slow); };

// Back: return to the previous page in the app, or home if this page was opened directly
const visited = [location.hash];
window.addEventListener('hashchange', () => {
  if (visited.length > 1 && visited[visited.length - 2] === location.hash) visited.pop(); else visited.push(location.hash);
  route();
});
$('backBtn').onclick = () => { if (visited.length > 1) history.back(); else location.hash = ''; };
route();
</script>
</body>
</html>
