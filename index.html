<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Seerah Poem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@1,500&display=swap">
<style>
  :root {
    --bg: #fff8ec; --card: #ffffff; --text: #2b2440; --muted: #7a7290;
    --line: #f0e4cf; --play: #22c55e; --chorus: #8b5cf6; --chorus-soft: #efe7ff;
    --gold: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.45 "Poppins", system-ui, "Segoe UI", sans-serif;
    background-image: radial-gradient(#f6dfb3 1.2px, transparent 1.2px); background-size: 26px 26px; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 170px; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }

  /* Home */
  .hero { text-align: center; margin: 8px 0 22px; }
  .hero .moon { font-size: 3.2rem; display: inline-block; animation: bob 3s ease-in-out infinite; }
  .hero h1 { font-size: 2.2rem; margin: 4px 0 2px; font-weight: 700; }
  .hero p { margin: 0; color: var(--muted); }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-6deg); } }

  .label { font-weight: 600; color: var(--muted); margin: 18px 4px 10px; font-size: 1rem; }
  .choruses { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .sec { --c: #ef4444; position: relative; background: var(--card); border-radius: 22px; padding: 16px 12px 14px;
    text-align: center; border: 3px solid var(--c); box-shadow: 0 6px 0 var(--c); transition: transform .1s; }
  .sec:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c); }
  .sec .num { width: 58px; height: 58px; border-radius: 50%; background: var(--c); color: #fff; font-weight: 700;
    font-size: 1.7rem; display: grid; place-items: center; margin: 0 auto 8px; }
  .sec .t { font-weight: 600; font-size: 1.1rem; }
  .sec .n { color: var(--muted); font-size: .9rem; }
  .sec .stars { position: absolute; top: 8px; right: 10px; font-size: .85rem; }

  /* Section page */
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .home { background: var(--card); border-radius: 16px; padding: 10px 16px; font-weight: 600; border: 3px solid var(--line); }
  .sectitle { flex: 1; font-size: 1.6rem; font-weight: 700; margin: 0; color: var(--c); }
  .sectitle input { width: 100%; font-weight: 700; color: inherit; border: 2px dashed var(--c); border-radius: 12px; padding: 4px 8px; background: #fff; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .big { flex: 1; min-width: 140px; border-radius: 18px; padding: 14px 16px; font-weight: 700; font-size: 1.1rem;
    background: var(--c); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
  .big.alt { background: var(--card); color: var(--c); border: 3px solid var(--c); }
  .big.on { background: var(--gold); color: #fff; border-color: var(--gold); }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .hint { background: #fff3c4; border-radius: 14px; padding: 10px 14px; margin: -4px 0 14px; font-size: .95rem; }

  .lines { display: grid; gap: 10px; }
  .lineCard { --c2: var(--c); display: flex; align-items: center; gap: 12px; width: 100%; text-align: start;
    background: var(--card); border-radius: 18px; padding: 12px 14px; border: 3px solid var(--line);
    box-shadow: 0 4px 0 var(--line); transition: transform .1s; position: relative; }
  .lineCard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .lineCard .bubble { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--c2); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 1.15rem; }
  .lineCard .words { flex: 1; font-size: 1.15rem; font-weight: 500; white-space: pre-line; }
  .lineCard .words:not(.empty) { font-family: "Lora", Georgia, serif; font-style: italic; font-size: 1.2rem; }
  .lineCard .words.empty { color: var(--muted); }
  .bubble svg { width: 30px; height: 30px; display: block; }
  .lineCard .icon { flex: none; font-size: 1.4rem; }
  .lineCard.chorus .bubble { background: #fff; border: 2px solid #dccbff; }
  .home { color: inherit; text-decoration: none; }
  .lineCard.chorus { --c2: var(--chorus); background: var(--chorus-soft); border-color: #dccbff; box-shadow: 0 4px 0 #dccbff; }
  .lineCard.playing { border-color: var(--play); box-shadow: 0 4px 0 var(--play); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.015); } }
  .lineCard .pick { position: absolute; top: -8px; right: -6px; background: var(--gold); color: #fff; font-weight: 700;
    border-radius: 999px; min-width: 30px; height: 30px; display: grid; place-items: center; padding: 0 8px; font-size: .95rem; }
  .lineCard textarea { flex: 1; min-height: 52px; resize: vertical; border: 2px dashed var(--c2); border-radius: 12px; padding: 6px 10px; background: #fff; }

  /* Player bar */
  .player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 3px solid var(--line);
    box-shadow: 0 -6px 20px rgba(0,0,0,.08); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .player .inner { max-width: 760px; margin: 0 auto; }
  .now { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; margin-bottom: 6px; }
  .now .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  .bar div { height: 100%; width: 0; background: var(--play); border-radius: 999px; transition: width .2s linear; }
  .ctrls { display: flex; gap: 8px; }
  .ctrl { flex: 1; border-radius: 14px; padding: 10px 4px; background: #f6f1e7; font-weight: 600; font-size: .95rem; }
  .ctrl .e { display: block; font-size: 1.4rem; line-height: 1.1; }
  .ctrl.on { background: #dcfce7; color: #166534; }

  .grown { text-align: center; margin-top: 30px; }
  .grown button { color: var(--muted); font-size: .9rem; text-decoration: underline; }
  .editbar { background: #fff3c4; border-radius: 16px; padding: 12px 14px; margin-bottom: 16px; font-size: .95rem; }
  .editbar .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .editbar button { background: #fff; border-radius: 12px; padding: 8px 12px; font-weight: 600; border: 2px solid #f0d78a; }
  #err { color: #b91c1c; font-size: .9rem; }
</style>
</head>
<body>
<main id="app"></main>

<div class="player">
  <div class="inner">
    <div class="now"><span class="what" id="what">Tap a line to listen 🎧</span><span id="stars"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="ctrls">
      <button class="ctrl" id="pause"><span class="e">⏸️</span><span>Pause</span></button>
      <button class="ctrl" id="stop"><span class="e">⏹️</span><span>Stop</span></button>
      <button class="ctrl on" id="repeat"><span class="e">🔁</span><span>Repeat</span></button>
      <button class="ctrl" id="slow"><span class="e">🐢</span><span>Slow</span></button>
    </div>
    <div id="err"></div>
  </div>
</div>

<script src="lyrics.js"></script>
<script>
const $ = id => document.getElementById(id);
const COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#0ea5e9', '#6366f1', '#a855f7', '#ec4899', '#84cc16'];
const SECTIONS = window.SECTIONS || [];
const BASE = window.LYRICS || {};
const KAABA = `<svg viewBox="0 0 32 32" aria-label="Kaaba"><path d="M5 10 16 6l11 4v15l-11 4-11-4z" fill="#1c1917"/><path d="M16 6v23" stroke="#44403c" stroke-width="1"/><path d="M5 13.5 16 17.5l11-4v2.6L16 20.1 5 16.1z" fill="#eab308"/><rect x="19" y="20.5" width="4" height="6" rx=".6" transform="skewY(-20)" transform-origin="21 23" fill="#ca8a04"/></svg>`;
const MADINAH = `<svg viewBox="0 0 32 32" aria-label="Madinah green dome"><path d="M16 2.5v4" stroke="#facc15" stroke-width="1.6"/><path d="M17.6 3.2a1.9 1.9 0 1 1-1.4-.9 1.5 1.5 0 1 0 1.4.9z" fill="#facc15"/><path d="M6.5 20c0-7 4.2-12.5 9.5-12.5S25.5 13 25.5 20z" fill="#16a34a"/><path d="M9 11.5c1.5-2.6 4-4 7-4" stroke="#4ade80" stroke-width="1.4" fill="none" stroke-linecap="round"/><rect x="5" y="20" width="22" height="3" rx="1" fill="#15803d"/><rect x="6" y="23" width="20" height="5.5" fill="#f5f5f4"/><path d="M10 28.5v-3a1.5 1.5 0 0 1 3 0v3M19 28.5v-3a1.5 1.5 0 0 1 3 0v3" fill="#a8a29e"/></svg>`;
const CHORUSES = [
  { key: 'chorus', name: 'La-ilaha-ill-Allah', icon: KAABA, file: 'clips/Chorus.mp3' },
  { key: 'salawat', name: 'Salawat', icon: MADINAH, file: 'clips/Salawat.mp3' },
];
// Extra chorus buttons placed inside a section, after a given line
const INSERTS = window.INSERTS || {};

const fileFor = key => CHORUSES.find(c => c.key === key)?.file || `clips/Trim_Seerah_${key}.mp3`;
const nameFor = key => CHORUSES.find(c => c.key === key)?.name || `Line ${key}`;

// ---------- grown-up edits (kept in this browser) ----------
let edits = { lyrics: {}, titles: {} };
try { edits = Object.assign(edits, JSON.parse(localStorage.getItem('seerahEdits') || '{}')); } catch {}
const saveEdits = () => { try { localStorage.setItem('seerahEdits', JSON.stringify(edits)); } catch {} };
const lyric = key => (edits.lyrics[key] ?? BASE[key] ?? '').trim();
const title = i => edits.titles[i] ?? SECTIONS[i].title;

let stars = {};
try { stars = JSON.parse(localStorage.getItem('seerahStars') || '{}'); } catch {}
const saveStars = () => { try { localStorage.setItem('seerahStars', JSON.stringify(stars)); } catch {} };

let editing = false;
let choosing = false;
let chosen = [];

// ---------- pages ----------
function route() {
  const m = location.hash.match(/^#section-(\d+)$/);
  const i = m ? +m[1] - 1 : -1;
  choosing = false; chosen = [];
  if (SECTIONS[i]) renderSection(i); else renderHome();
  window.scrollTo(0, 0);
}

function renderHome() {
  const app = $('app');
  app.style.removeProperty('--c');
  app.innerHTML = `
    <div class="hero"><span class="moon">🌙</span><h1>My Seerah Poem</h1><p>Pick a section and start learning!</p></div>
    ${editBar()}
    <div class="label">🔁 Repeat with me!</div>
    <div class="choruses" id="choruses"></div>
    <div class="label">📖 Sections</div>
    <div class="sections" id="sections"></div>
    <div class="grown"><button id="grown">${editing ? 'Done editing' : '✏️ Grown-ups: add lyrics'}</button></div>`;
  CHORUSES.forEach(c => $('choruses').append(lineCard(c.key, true)));
  SECTIONS.forEach((s, i) => {
    const a = document.createElement('a');
    a.href = `#section-${i + 1}`;
    a.style.textDecoration = 'none'; a.style.color = 'inherit';
    const n = s.to - s.from + 1;
    const st = stars[i] ? '⭐'.repeat(Math.min(3, stars[i])) : '';
    a.innerHTML = `<div class="sec" style="--c:${COLORS[i % COLORS.length]}">
      <span class="stars">${st}</span>
      <div class="num">${i + 1}</div><div class="t">${esc(title(i))}</div><div class="n">${n} lines</div></div>`;
    $('sections').append(a);
  });
  wireEditBar();
  $('grown').onclick = () => { editing = !editing; route(); };
  paintPlaying();
}

// The lines in a section, with any extra chorus buttons slotted in after their line
function sectionKeys(i) {
  const s = SECTIONS[i], keys = [];
  for (let n = s.from; n <= s.to; n++) {
    keys.push(String(n));
    if (INSERTS[n]) keys.push(INSERTS[n]);
  }
  return keys;
}

function renderSection(i) {
  const s = SECTIONS[i];
  const app = $('app');
  app.style.setProperty('--c', COLORS[i % COLORS.length]);
  app.innerHTML = `
    <div class="top">
      <a class="home" href="#">🕌 Home</a>
      <h2 class="sectitle">${editing ? `<input id="titleIn" value="${esc(title(i))}">` : esc(title(i))}</h2>
    </div>
    ${editBar()}
    <div class="actions ${editing ? 'hidden' : ''}">
      <button class="big" id="playAll">▶️ Play whole section</button>
      <button class="big alt ${choosing ? 'on' : ''}" id="choose">${choosing ? (chosen.length ? `▶️ Play my ${chosen.length}` : '⭐ Tap lines to pick') : '⭐ Pick my lines'}</button>
    </div>
    ${choosing ? '<div class="hint">Tap the lines you want, in the order you want. You can add La-ilaha-ill-Allah and Salawat too! Then press <b>Play my lines</b>. <button id="cancelPick" style="text-decoration:underline">Cancel</button></div>' : ''}
    <div class="lines" id="lines"></div>
    <div class="label">🔁 Repeat with me!</div>
    <div class="lines" id="chorusLines"></div>
    <div class="grown"><button id="grown">${editing ? 'Done editing' : '✏️ Grown-ups: add lyrics'}</button></div>`;
  sectionKeys(i).forEach(k => {
    const isChorus = CHORUSES.some(c => c.key === k);
    if (isChorus && editing) return;
    $('lines').append(lineCard(k, isChorus, k));
  });
  CHORUSES.forEach(c => $('chorusLines').append(lineCard(c.key, true)));

  $('grown').onclick = () => { editing = !editing; renderSection(i); };
  wireEditBar();
  if (editing) {
    $('titleIn').oninput = e => { edits.titles[i] = e.target.value; saveEdits(); };
  } else {
    $('playAll').onclick = () => playList(sectionKeys(i), title(i), i);
    $('choose').onclick = () => {
      if (choosing && chosen.length) { playList([...chosen], 'My lines', i); choosing = false; chosen = []; renderSection(i); return; }
      choosing = true; renderSection(i);
    };
    $('cancelPick')?.addEventListener('click', () => { choosing = false; chosen = []; renderSection(i); });
  }
  paintPlaying();
}

function lineCard(key, isChorus, shownNum) {
  const c = CHORUSES.find(x => x.key === key);
  if (editing) {
    const div = document.createElement('div');
    div.className = 'lineCard' + (isChorus ? ' chorus' : '');
    div.innerHTML = `<span class="bubble">${c ? c.icon : shownNum}</span>`;
    const ta = document.createElement('textarea');
    ta.dir = 'auto';
    ta.placeholder = `Type the words for ${nameFor(key)}…`;
    ta.value = lyric(key);
    ta.oninput = () => { edits.lyrics[key] = ta.value; saveEdits(); };
    const listen = document.createElement('button');
    listen.className = 'icon'; listen.textContent = '🔊'; listen.title = 'Listen';
    listen.onclick = () => playList([key], nameFor(key));
    div.append(ta, listen);
    return div;
  }
  const b = document.createElement('button');
  b.className = 'lineCard' + (isChorus ? ' chorus' : '');
  b.dataset.key = key;
  const words = lyric(key);
  const picks = chosen.map((k, j) => k === key ? j + 1 : 0).filter(Boolean);
  b.innerHTML = `<span class="bubble">${c ? c.icon : shownNum}</span>
    <span class="words ${words ? '' : 'empty'}" dir="auto">${words ? esc(words) : esc(nameFor(key))}</span>
    <span class="icon">${choosing ? '⭐' : '▶️'}</span>
    ${picks.length ? `<span class="pick">${picks.join(', ')}</span>` : ''}`;
  b.onclick = () => {
    if (choosing) {
      chosen.push(key);
      const m = location.hash.match(/^#section-(\d+)$/);
      renderSection(+m[1] - 1);
    } else {
      playList([key], words ? nameFor(key) : nameFor(key));
    }
  };
  return b;
}

function editBar() {
  if (!editing) return '';
  return `<div class="editbar">✏️ <b>Grown-up mode:</b> type the words into each line. They save in this browser straight away.
    To show them for everyone, download the lyrics file and send it to whoever looks after the website.
    <div class="row"><button id="dl">⬇️ Download lyrics file</button><button id="resetEdits">Clear my typing</button></div></div>`;
}

function wireEditBar() {
  if (!editing) return;
  $('dl').onclick = downloadLyrics;
  $('resetEdits').onclick = () => {
    if (confirm('Clear everything typed in this browser?')) { edits = { lyrics: {}, titles: {} }; saveEdits(); route(); }
  };
}

function downloadLyrics() {
  const q = s => JSON.stringify(s);
  let out = '// Section titles and lyrics for the Seerah poem.\n// Type each line\'s words between the quotes. Leave it empty ("") to just show the line number.\n\nwindow.SECTIONS = [\n';
  SECTIONS.forEach((s, i) => { out += `  { title: ${q(title(i))}, from: ${s.from}, to: ${s.to} },\n`; });
  out += '];\n\n// Extra La-ilaha-ill-Allah ("chorus") or Salawat ("salawat") buttons, placed after a line number.\nwindow.INSERTS = {\n';
  Object.entries(INSERTS).forEach(([n, k]) => { out += `  ${n}: ${q(k)},\n`; });
  out += '};\n\nwindow.LYRICS = {\n';
  out += `  chorus: ${q(lyric('chorus'))},\n  salawat: ${q(lyric('salawat'))},\n`;
  const last = SECTIONS.length ? SECTIONS[SECTIONS.length - 1].to : 0;
  for (let n = 1; n <= last; n++) out += `  ${n}: ${q(lyric(String(n)))},\n`;
  out += '};\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type: 'text/javascript' }));
  a.download = 'lyrics.js';
  a.click();
}

function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

// ---------- player ----------
const audio = new Audio();
audio.preservesPitch = true;
let list = [], pos = -1, listName = '', listSection = -1;
let repeat = true, slow = false, loops = 0, gapTimer = null;

function playList(keys, name, sectionIndex = -1) {
  list = keys; pos = 0; listName = name; listSection = sectionIndex; loops = 0;
  start();
}

function start() {
  clearTimeout(gapTimer); gapTimer = null;
  $('err').textContent = '';
  audio.src = fileFor(list[pos]);
  audio.playbackRate = slow ? 0.75 : 1;
  audio.play().catch(() => {});
  paintPlaying();
}

function stop() {
  clearTimeout(gapTimer); gapTimer = null;
  audio.pause(); audio.removeAttribute('src'); audio.load();
  list = []; pos = -1; loops = 0;
  $('prog').style.width = '0';
  paintPlaying();
}

audio.addEventListener('ended', () => {
  if (pos < list.length - 1) { pos++; start(); return; }
  loops++;
  if (list.length > 1 && listSection >= 0) { stars[listSection] = (stars[listSection] || 0) + 1; saveStars(); }
  if (repeat) { gapTimer = setTimeout(() => { gapTimer = null; pos = 0; start(); }, 1000); }
  paintPlaying();
});
audio.addEventListener('timeupdate', () => {
  $('prog').style.width = audio.duration ? (100 * audio.currentTime / audio.duration) + '%' : '0';
});
audio.addEventListener('error', () => {
  if (audio.getAttribute('src')) $('err').textContent = `Oops, couldn't find ${audio.getAttribute('src')}`;
});

function paintPlaying() {
  const key = pos >= 0 ? list[pos] : null;
  document.querySelectorAll('.lineCard[data-key]').forEach(el => el.classList.toggle('playing', el.dataset.key === key && !audio.paused));
  let what = 'Tap a line to listen 🎧';
  if (key) {
    what = list.length > 1 ? `${listName}: ${nameFor(key)} (${pos + 1} of ${list.length})` : nameFor(key);
    if (gapTimer) what = '🎉 Again!';
    else if (audio.paused) what = '⏸️ ' + what;
  }
  $('what').textContent = what;
  $('stars').textContent = key && loops ? '⭐'.repeat(Math.min(loops, 5)) + (loops > 5 ? ` ×${loops}` : '') : '';
  $('pause').innerHTML = key && audio.paused && !gapTimer
    ? '<span class="e">▶️</span><span>Play</span>' : '<span class="e">⏸️</span><span>Pause</span>';
}
audio.addEventListener('play', paintPlaying);
audio.addEventListener('pause', paintPlaying);

$('pause').onclick = () => {
  if (pos < 0) return;
  if (gapTimer) { clearTimeout(gapTimer); gapTimer = null; paintPlaying(); return; }
  if (audio.paused) audio.play(); else audio.pause();
};
$('stop').onclick = stop;
$('repeat').onclick = () => { repeat = !repeat; $('repeat').classList.toggle('on', repeat); };
$('slow').onclick = () => { slow = !slow; audio.playbackRate = slow ? 0.75 : 1; $('slow').classList.toggle('on', slow); };

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
